name GLaDOS Auto Checkin

on
  workflowdispatch  # 
    schedule
        - cron '0 4 * * *'   #  UTC 4 （ 12 ）
            - cron '0 0 1 * *'   #  1 

            jobs
              checkin
                  name GLaDOS 
                      runs-on ubuntu-latest
                          timeout-minutes 15
                              if github.eventname = 'schedule'  github.event.schedule = '0 0 1 * *'
                                  concurrency
                                        group glados-checkin
                                              cancel-in-progress false

                                                  permissions
                                                        contents read

                                                            steps
                                                                  - uses actions/checkout@v4

                                                                        - name Setup Python
                                                                                uses actions/setup-python@v5
                                                                                        with
                                                                                                  python-version '3.11'

                                                                                                        - name Install dependencies
                                                                                                                run pip install "requests==2.32.3" --no-cache-dir

                                                                                                                      - name Run checkin
                                                                                                                              id gladoscheckin
                                                                                                                                      continue-on-error true
                                                                                                                                              run python checkin.py
                                                                                                                                                      env
                                                                                                                                                                COOKIES  secrets.COOKIES 
                                                                                                                                                                          COOKIES2  secrets.COOKIES2 
                                                                                                                                                                                    GLADOSREPORTPATH  runner.temp /glados-status.json
                                                                                                                                                                                              SENDKEY  secrets.SENDKEY 
                                                                                                                                                                                                        SERVERCHANKEY  secrets.SERVERCHANKEY 
                                                                                                                                                                                                                  TGBOTTOKEN  secrets.TGBOTTOKEN 
                                                                                                                                                                                                                            TGCHATID  secrets.TGCHATID 
                                                                                                                                                                                                                                      PUSHPLUSTOKEN  secrets.PUSHPLUSTOKEN 
                                                                                                                                                                                                                                                DINGTALKWEBHOOK  secrets.DINGTALKWEBHOOK 
                                                                                                                                                                                                                                                          DINGTALKSECRET  secrets.DINGTALKSECRET 
                                                                                                                                                                                                                                                                    FEISHUWEBHOOK  secrets.FEISHUWEBHOOK 
                                                                                                                                                                                                                                                                              FEISHUSECRET  secrets.FEISHUSECRET 
                                                                                                                                                                                                                                                                                        WECOMBOTWEBHOOK  secrets.WECOMBOTWEBHOOK 
                                                                                                                                                                                                                                                                                                  YUNHUTOKEN  secrets.YUNHUTOKEN 
                                                                                                                                                                                                                                                                                                            YUNHURECVID  secrets.YUNHURECVID 
                                                                                                                                                                                                                                                                                                                      YUNHURECVTYPE  secrets.YUNHURECVTYPE 
                                                                                                                                                                                                                                                                                                                                # #9 （；，）
                                                                                                                                                                                                                                                                                                                                          EXCHANGEPLAN  secrets.EXCHANGEPLAN 
                                                                                                                                                                                                                                                                                                                                                    GLADOSEXCHANGEPLAN  secrets.GLADOSEXCHANGEPLAN 

                                                                                                                                                                                                                                                                                                                                                          - name Notify Feishu
                                                                                                                                                                                                                                                                                                                                                                  if always
                                                                                                                                                                                                                                                                                                                                                                          uses ./.github/actions/notify-automation
                                                                                                                                                                                                                                                                                                                                                                                  env
                                                                                                                                                                                                                                                                                                                                                                                            FEISHUWEBHOOKURL  secrets.FEISHUWEBHOOKURL 
                                                                                                                                                                                                                                                                                                                                                                                                      FEISHUWEBHOOKSECRET  secrets.FEISHUWEBHOOKSECRET 
                                                                                                                                                                                                                                                                                                                                                                                                              with
                                                                                                                                                                                                                                                                                                                                                                                                                        report-path  runner.temp /glados-status.json
                                                                                                                                                                                                                                                                                                                                                                                                                                  fallback-title GLaDOS 
                                                                                                                                                                                                                                                                                                                                                                                                                                            fallback-status  steps.gladoscheckin.outcome 

                                                                                                                                                                                                                                                                                                                                                                                                                                                  - name Mark check-in failure
                                                                                                                                                                                                                                                                                                                                                                                                                                                          if steps.gladoscheckin.outcome == 'failure'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  run exit 1

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    keepalive
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        name 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if github.eventname == 'schedule' && github.event.schedule == '0 0 1 * *'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                runs-on ubuntu-latest
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    timeout-minutes 5
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        concurrency
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              group glados-keepalive
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    cancel-in-progress false

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        permissions
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              contents write

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  steps
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - uses actions/checkout@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                with
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          fetch-depth 1

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                - name 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        run 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  git config user.name "github-actionsbot"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            git config user.email "github-actionsbot@users.noreply.github.com"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      git commit --allow-empty -m "chore keepalive to prevent workflow suspension"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                git push
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
name: Quya Daily Check-in

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: quya-daily-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    name: Quya check-in
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install "requests==2.32.3" --no-cache-dir

      - name: Check in
        id: quya_checkin
        continue-on-error: true
        env:
          QUYA_ACCOUNTS: ${{ secrets.QUYA_ACCOUNTS }}
          QUYA_PASSWORD: ${{ secrets.QUYA_PASSWORD }}
          QUYA_REPORT_PATH: ${{ runner.temp }}/quya-status.json
        run: python automation-adapters/quya-checkin.py

      - name: Notify Feishu
        if: always()
        uses: ./.github/actions/notify-automation
        with:
          report-path: ${{ runner.temp }}/quya-status.json
          fallback-title: 云桥自动签到
          fallback-status: ${{ steps.quya_checkin.outcome }}

      - name: Mark check-in failure
        if: steps.quya_checkin.outcome == 'failure'
        run: exit 1

name: Quya Daily Check-in

on:
  workflow_dispatch:
  schedule:
    - cron: "5 1 * * *"

concurrency:
  group: quya-daily-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    name: Quya check-in
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install "requests==2.32.3" --no-cache-dir

      - name: Check in
        env:
          QUYA_ACCOUNTS: ${{ secrets.QUYA_ACCOUNTS }}
          QUYA_PASSWORD: ${{ secrets.QUYA_PASSWORD }}
        run: python quya-checkin/github-checkin.py

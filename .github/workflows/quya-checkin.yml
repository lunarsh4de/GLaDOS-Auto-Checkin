name Quya Daily Check-in

on
  workflowdispatch
    schedule
        - cron "0 4 * * *"

        concurrency
          group quya-daily-checkin
            cancel-in-progress false

            permissions
              contents read

              jobs
                checkin
                    name Quya check-in
                        runs-on ubuntu-latest
                            timeout-minutes 10
                                env
                                      FEISHUWEBHOOKURL  secrets.FEISHUWEBHOOKURL 
                                            FEISHUWEBHOOKSECRET  secrets.FEISHUWEBHOOKSECRET 

                                                steps
                                                      - uses actions/checkout@v4

                                                            - uses actions/setup-python@v5
                                                                    with
                                                                              python-version "3.11"

                                                                                    - name Install dependency
                                                                                            run python -m pip install "requests==2.32.3" --no-cache-dir

                                                                                                  - name Check in
                                                                                                          id quyacheckin
                                                                                                                  continue-on-error true
                                                                                                                          env
                                                                                                                                    QUYAACCOUNTS  secrets.QUYAACCOUNTS 
                                                                                                                                              QUYAPASSWORD  secrets.QUYAPASSWORD 
                                                                                                                                                        QUYAREPORTPATH  runner.temp /quya-status.json
                                                                                                                                                                run python quya-checkin/github-checkin.py

                                                                                                                                                                      - name Notify Feishu
                                                                                                                                                                              if always
                                                                                                                                                                                      uses ./.github/actions/notify-automation
                                                                                                                                                                                              with
                                                                                                                                                                                                        report-path  runner.temp /quya-status.json
                                                                                                                                                                                                                  fallback-title 
                                                                                                                                                                                                                            fallback-status  steps.quyacheckin.outcome 

                                                                                                                                                                                                                                  - name Mark check-in failure
                                                                                                                                                                                                                                          if steps.quyacheckin.outcome == 'failure'
                                                                                                                                                                                                                                                  run exit 1
                                                                                                                                                                                                                                                  
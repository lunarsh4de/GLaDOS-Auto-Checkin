name: Notify automation status
description: Send a task-status-v1 report through the shared Feishu bot

inputs:
  report-path:
    description: Path to the task-status-v1 JSON report
    required: true
  fallback-title:
    description: User-facing title used when the task did not create a report
    required: true
  fallback-status:
    description: Final GitHub Actions step outcome
    required: false
    default: failure

runs:
  using: composite
  steps:
    - shell: bash
      env:
        REPORT_PATH: ${{ inputs.report-path }}
        FALLBACK_TITLE: ${{ inputs.fallback-title }}
        FALLBACK_STATUS: ${{ inputs.fallback-status }}
      run: |
        if [ -z "${FEISHU_WEBHOOK_URL:-}" ]; then
          echo "Feishu webhook is not configured; notification skipped."
          exit 0
        fi

        notifier="$GITHUB_ACTION_PATH/../../../automation-notify/send-feishu.py"
        if [ -f "$REPORT_PATH" ]; then
          python "$notifier" --report "$REPORT_PATH"
        else
          python "$notifier" \
            --title "$FALLBACK_TITLE" \
            --status "$FALLBACK_STATUS" \
            --message "- 任务状态: 未生成状态报告，请查看 GitHub Actions 日志"
        fi
